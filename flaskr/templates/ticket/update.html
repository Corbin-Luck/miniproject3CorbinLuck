{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit "{{ post['title'] }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="title">Title</label>
    <input name="title" id="title"
      value="{{ request.form['title'] or post['title'] }}" required>

    <label for="body">Body</label>
    <textarea name="body" id="body">{{ request.form['body'] or post['body'] }}</textarea>

    <input type="submit" value="Save">
  </form>

  <hr>

  <!-- Delete Button -->
  <button class="danger" onclick="openModal()">Delete</button>

  <!-- Delete Form (hidden submit) -->
  <form id="deleteForm" action="{{ url_for('ticket.delete', id=post['id']) }}" method="post"></form>

  <!-- Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h3>Confirm Delete</h3>
      <p>Are you sure you want to delete this post?</p>

      <div class="modal-actions">
        <button onclick="closeModal()">No</button>
        <button class="danger" onclick="confirmDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("deleteModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("deleteModal").style.display = "none";
    }

    function confirmDelete() {
      document.getElementById("deleteForm").submit();
    }
  </script>

  <style>
    .danger {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
    }

    .danger:hover {
      background: #b02a37;
    }

    /* Modal styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 6px;
      width: 300px;
      text-align: center;
    }

    .modal-actions {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }
  </style>

{% endblock %}
